name: focusmind
description: "FocusMind — App de enfoque y productividad (MVP)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0

  # --- Requeridas por lib/main.dart (bloqueador de apps) ---
  device_apps: ^2.2.0
  android_intent_plus: ^5.2.0
  flutter_foreground_task: ^8.13.0
  usage_stats: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
