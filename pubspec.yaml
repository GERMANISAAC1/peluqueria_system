name: focus_app
description: "Enfoque - App de productividad que bloquea apps distractoras."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Persistencia de configuración y estadísticas (requisito #11)
  shared_preferences: ^2.2.3

  # Permisos estándar (notificaciones, ignorar optimización de batería)
  permission_handler: ^11.3.1

  # NOTA: el listado de apps instaladas (requisito #1) ya NO usa un paquete
  # de terceros (`device_apps` fue eliminado por incompatibilidad con AGP
  # moderno). Ahora se resuelve con un MethodChannel propio hacia
  # MainActivity.kt — no requiere ninguna dependencia adicional aquí.

  # Abrir pantallas de ajustes de Android (Usage Access, Accessibility)
  # sin necesidad de escribir plugins nativos propios.
  android_intent_plus: ^5.2.0

  # Foreground Service real + notificación persistente + auto-arranque en
  # boot (requisitos #5, #7, #17). Requiere configuración nativa adicional.
  flutter_foreground_task: ^8.13.0

  # NOTA: `usage_stats` fue eliminado (mismo problema de compileSdk
  # desactualizado que tuvo `device_apps`). El acceso a UsageStatsManager
  # ahora se resuelve con un MethodChannel propio en MainActivity.kt.

  # Notificaciones puntuales (aviso de felicitación al terminar, requisito #20)
  flutter_local_notifications: ^17.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
